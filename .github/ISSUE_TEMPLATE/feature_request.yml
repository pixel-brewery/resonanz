name: Suggest a feature
description: Improve or add a concrete user workflow.
title: '[Feature]: '
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the task and current workflow.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: How should Resonanz help?
      description: A concrete example is more useful than a list of controls.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context and alternatives
      description: Optional. Use synthetic conversation content only.
