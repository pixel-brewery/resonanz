name: Frage stellen
description: Eine Frage zur Bedienung, Einrichtung oder Entwicklung stellen.
title: '[Frage]: '
body:
  - type: markdown
    attributes:
      value: |
        Die Produktdokumentation unter docs/project und CONTRIBUTING.md enthalten Einrichtung und Entwicklerstart. Bitte keine Zugangsdaten oder privaten Transkripte teilen.
  - type: textarea
    id: question
    attributes:
      label: Deine Frage
      description: Was möchtest du tun und wo kommst du nicht weiter?
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Umgebung
      description: 'Falls relevant: Version, Betriebssystem, Sprache und gewählte CLI.'
