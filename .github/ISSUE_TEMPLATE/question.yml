name: Ask a question
description: Ask about usage, setup or development.
title: '[Question]: '
body:
  - type: markdown
    attributes:
      value: |
        See docs/project and CONTRIBUTING.md for setup and development. Do not share credentials or private transcripts.
  - type: textarea
    id: question
    attributes:
      label: Your question
      description: What are you trying to do, and where are you stuck?
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: If relevant, include version, OS, language and selected CLI.
