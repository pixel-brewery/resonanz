name: Report a bug
description: Describe a reproducible problem in Resonanz.
title: '[Bug]: '
body:
  - type: markdown
    attributes:
      value: |
        Use synthetic conversation content. Do not share credentials, sign-in links or private recordings. Report vulnerabilities privately through SECURITY.md.
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Include the expected behavior and a minimal reproduction.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Version or commit, OS, interface/speech language and selected assistant CLI.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Supporting evidence
      description: Sanitized logs or screenshots using synthetic data only.
