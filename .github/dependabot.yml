version: 2
updates:
  - package-ecosystem: npm
    directory: /
    rebase-strategy: auto
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: typescript
      # These package versions are maintained as committed vendor archives.
      - dependency-name: '@pixel-brewery/markdowner-core'
      - dependency-name: '@pixel-brewery/mosaik-elements'
      - dependency-name: '@pixel-brewery/mosaik-elements-angular'
      - dependency-name: '@pixel-brewery/mosaik-elements-foundation'
      - dependency-name: '@pixel-brewery/mosaik-icons'
      - dependency-name: '@pixel-brewery/mosaik-themes'
      - dependency-name: '@pixel-brewery/synapse-auth'
      - dependency-name: '@pixel-brewery/synapse-core'
      - dependency-name: '@pixel-brewery/synapse-provider-claude'
      - dependency-name: '@pixel-brewery/synapse-provider-codex'
      - dependency-name: '@pixel-brewery/synapse-provider-opencode'
      - dependency-name: '@pixel-brewery/synapse-runtime'
    groups:
      angular:
        patterns: ['@angular/*', '@angular-devkit/*', '@schematics/*']
      nx:
        patterns: ['@nx/*', nx]
      electron:
        patterns: [electron, '@electron-forge/*', '@electron/*']
      testing:
        patterns: [vitest, '@vitest/*', playwright, '@playwright/*']
  - package-ecosystem: github-actions
    directory: /
    rebase-strategy: auto
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ['*']
