# Green Dependabot pull requests merge automatically: .github/workflows/dependabot-merge.yml
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    rebase-strategy: auto
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)
    groups:
      angular:
        patterns: ['@angular/*', '@angular-devkit/*', '@schematics/*']
      nx:
        patterns: ['@nx/*', nx]
      electron:
        patterns: [electron, '@electron-forge/*', '@electron/*']
      testing:
        patterns: [vitest, '@vitest/*', playwright, '@playwright/*']
      pixel-brewery-mosaik:
        patterns: ['@pixel-brewery/mosaik-*', '@pixel-brewery/markdowner-core']
      pixel-brewery-synapse:
        patterns: ['@pixel-brewery/synapse-*']
      pixel-brewery-platform:
        patterns: ['@pixel-brewery/archipel-*']
      pixel-brewery-ngpel:
        patterns: ['@pixel-brewery/ngpel-*']
  - package-ecosystem: github-actions
    directory: /
    rebase-strategy: auto
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(ci)
    groups:
      github-actions-updates:
        patterns: ['*']
