name: Publish GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-pages.yml
      - 'site/**'
      - .github/assets/project-card.webp
      - resources/icons/png/app/resonanz-192.png
  workflow_dispatch:
    inputs:
      expected_head_sha:
        description: Exact main source requested by trusted dependency automation
        required: false
        default: ''
        type: string

permissions: {}

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      ${{ github.repository == 'pixel-brewery/resonanz' && !github.event.repository.private &&
          github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Stage the project artwork and icon
        run: |
          mkdir -p site/assets
          cp .github/assets/project-card.webp site/project-card.webp
          cp resources/icons/png/app/resonanz-192.png site/assets/resonanz-icon.png

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - name: Require the current requested documentation source
        if: github.event_name == 'workflow_dispatch' && inputs.expected_head_sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
        run: |
          test "$GITHUB_SHA" = "$EXPECTED_HEAD_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)" = "$EXPECTED_HEAD_SHA"

      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
