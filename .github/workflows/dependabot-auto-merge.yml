name: Merge verified Dependabot updates

on:
  workflow_run:
    workflows: [Desktop quality]
    types: [completed]

permissions: {}

jobs:
  merge:
    if: >-
      ${{ github.repository_id == '1440725741' &&
          github.event.workflow_run.event == 'pull_request' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_repository.id == github.event.repository.id }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      merged: ${{ steps.merge.outputs.merged }}
      merge_sha: ${{ steps.merge.outputs.merge_sha }}
    concurrency:
      group: dependabot-merge-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.id }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
      pull-requests: read
    steps:
      # Run the default-branch helper without PR code, dependency installation or artifacts.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.15.0
          package-manager-cache: false

      - name: Merge only the unchanged Dependabot head after every required job succeeds
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: node .github/scripts/mergeDependabotPullRequest.mjs

  request-release:
    needs: merge
    if: needs.merge.outputs.merged == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: dependency-release-${{ needs.merge.outputs.merge_sha }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: write
    steps:
      # Retain the successful merge output when retrying a failed release request.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.15.0
          package-manager-cache: false

      - name: Request the release for the retained merge source
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_COMMIT_SHA: ${{ needs.merge.outputs.merge_sha }}
        run: node .github/scripts/requestMergedRelease.mjs

      - name: Refresh the remaining Dependabot updates
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run rebase-dependabot.yml --repo "$GITHUB_REPOSITORY" --ref main
