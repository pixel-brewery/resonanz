name: Continuous Desktop Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      specifier:
        description: Semantic version increment for the next desktop release
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]
      source_sha:
        description: Exact dependency merge source; leave blank for a manual release
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: continuous-desktop-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  NODE_VERSION: 24.15.0
  YARN_VERSION: 4.10.3

jobs:
  configure:
    name: Prepare one immutable release candidate
    if: github.repository_id == '1440725741' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require the exact public main source
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          if [ -n "$EXPECTED_SOURCE_SHA" ] && [ "$EXPECTED_SOURCE_SHA" != "$GITHUB_SHA" ]; then
            echo 'The requested dependency merge is no longer the selected release source.' >&2
            exit 1
          fi
          gh api repositories/1440725741 --jq 'select(.id == 1440725741 and .full_name == "pixel-brewery/resonanz" and .private == false and .default_branch == "main") | .full_name' | grep -Fx "$GITHUB_REPOSITORY"
          git fetch origin main --tags
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - run: corepack enable
      - run: corepack prepare yarn@${YARN_VERSION} --activate
      - run: yarn install --immutable
      - name: Resolve version, changelog, commit and tag once
        id: release
        env:
          RELEASE_SPECIFIER: ${{ inputs.specifier || 'patch' }}
        run: |
          set -euo pipefail
          case "$RELEASE_SPECIFIER" in patch|minor|major) ;; *) exit 1 ;; esac
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          release_args=("$RELEASE_SPECIFIER")
          stable_tags="$(git tag --list)"
          if ! grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' <<< "$stable_tags"; then
            release_args+=(--first-release)
          fi
          yarn release:nx "${release_args[@]}"
          version="$(node -p "require('./package.json').version")"
          RELEASE_VERSION="$version" node --input-type=module <<'NODE'
          const version = process.env.RELEASE_VERSION;
          if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/u.test(version) || version.split('.').some((part) => Number(part) > 65535)) throw new Error('The release version must fit the installed updater and Windows version range.');
          NODE
          tag="v${version}"
          yarn prettier --write CHANGELOG.md
          if ! git diff --quiet -- CHANGELOG.md; then
            git add CHANGELOG.md
            git commit --amend --no-edit
            git tag --force --annotate "$tag" --message "$tag"
          fi
          test "$(git rev-parse HEAD^)" = "$GITHUB_SHA"
          test "$(git rev-list --count "${GITHUB_SHA}..HEAD")" = 1
          test "$(git rev-parse "${tag}^{commit}")" = "$(git rev-parse HEAD)"
          while IFS= read -r path; do
            case "$path" in package.json|yarn.lock|CHANGELOG.md) ;; *) echo "Unexpected release change: $path" >&2; exit 1 ;; esac
          done < <(git diff --name-only "$GITHUB_SHA" HEAD)
          test -z "$(git status --porcelain --untracked-files=no)"
          test -z "$(git ls-remote --tags origin "refs/tags/${tag}")"
          mkdir -p "$RUNNER_TEMP/release-metadata"
          git bundle create "$RUNNER_TEMP/release-metadata/release.bundle" "refs/tags/${tag}" "^${GITHUB_SHA}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-metadata
          path: ${{ runner.temp }}/release-metadata/release.bundle
          if-no-files-found: error
          retention-days: 14

  build:
    name: Verify and make ${{ matrix.platform }}/${{ matrix.architecture }}
    needs: configure
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin
            architecture: arm64
            artifact: out/make/**/*.dmg
          - os: windows-latest
            platform: win32
            architecture: x64
            artifact: out/make/**/ResonanzSetup.exe
    env:
      RELEASE_VERSION: ${{ needs.configure.outputs.version }}
      RELEASE_TAG: ${{ needs.configure.outputs.tag }}
      RELEASE_COMMIT: ${{ needs.configure.outputs.commit }}
      EXPECTED_PLATFORM: ${{ matrix.platform }}
      EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-metadata
          path: ${{ runner.temp }}/release-metadata
      - name: Check out the exact prepared release
        run: |
          set -euo pipefail
          git bundle verify "$RUNNER_TEMP/release-metadata/release.bundle"
          git fetch --no-tags "$RUNNER_TEMP/release-metadata/release.bundle" "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          test "$(git rev-parse "${RELEASE_TAG}^{commit}")" = "$RELEASE_COMMIT"
          test "$(git rev-parse "${RELEASE_COMMIT}^")" = "$GITHUB_SHA"
          git checkout --detach "$RELEASE_COMMIT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - run: corepack enable
      - run: corepack prepare yarn@${YARN_VERSION} --activate
      - name: Require the supported native runner target
        run: |
          node --input-type=module <<'NODE'
          if (process.platform !== process.env.EXPECTED_PLATFORM || process.arch !== process.env.EXPECTED_ARCHITECTURE) throw new Error('The release runner does not match the supported native target.');
          NODE
      - run: yarn install --immutable
      - run: yarn format:check
      - run: yarn verify
      - name: Exercise the Windows speech runtime
        if: matrix.platform == 'win32'
        run: node tools/verify-windows-speech.mjs
      - run: yarn test:e2e
      - name: Make native installers without platform certificates
        run: yarn make
      - name: Verify the ad-hoc macOS bundle and installer integrity
        if: matrix.platform == 'darwin'
        run: |
          set -euo pipefail
          app='out/Resonanz-darwin-arm64/Resonanz.app'
          codesign --verify --deep --strict "$app"
          codesign -dvvv "$app" 2> "$RUNNER_TEMP/resonanz-signature.txt"
          grep -q '^Signature=adhoc$' "$RUNNER_TEMP/resonanz-signature.txt"
          if grep -q 'flags=.*runtime' "$RUNNER_TEMP/resonanz-signature.txt"; then exit 1; fi
          while IFS= read -r -d '' image; do hdiutil verify "$image"; done < <(find out/make -name '*.dmg' -print0)
      - run: yarn verify:package
      - run: yarn test:e2e --packaged
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-${{ matrix.platform }}-${{ matrix.architecture }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish verified installers and the existing updater feed
    needs: [configure, build]
    environment: release-main
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      metadata_committed: ${{ steps.publication-state.outcome == 'success' && (steps.publication-state.outputs.push_required == 'false' || steps.publish-metadata.outcome == 'success') }}
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.configure.outputs.version }}
      RELEASE_TAG: ${{ needs.configure.outputs.tag }}
      RELEASE_COMMIT: ${{ needs.configure.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-metadata
          path: ${{ runner.temp }}/release-metadata
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: installer-*
          path: out/release-input
      - name: Validate the prepared commit and resume only its own metadata
        id: publication-state
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          test -z "$EXPECTED_SOURCE_SHA" || test "$EXPECTED_SOURCE_SHA" = "$GITHUB_SHA"
          gh api repositories/1440725741 --jq 'select(.id == 1440725741 and .full_name == "pixel-brewery/resonanz" and .private == false and .default_branch == "main") | .full_name' | grep -Fx "$GITHUB_REPOSITORY"
          git bundle verify "$RUNNER_TEMP/release-metadata/release.bundle"
          git fetch --no-tags "$RUNNER_TEMP/release-metadata/release.bundle" "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          test "$(git rev-parse "${RELEASE_TAG}^{commit}")" = "$RELEASE_COMMIT"
          test "$(git rev-parse "${RELEASE_COMMIT}^")" = "$GITHUB_SHA"
          test "$(git rev-list --count "${GITHUB_SHA}..${RELEASE_COMMIT}")" = 1
          while IFS= read -r path; do
            case "$path" in package.json|yarn.lock|CHANGELOG.md) ;; *) echo "Unexpected release change: $path" >&2; exit 1 ;; esac
          done < <(git diff --name-only "$GITHUB_SHA" "$RELEASE_COMMIT")
          git checkout --detach "$RELEASE_COMMIT"
          test "$(node -p "require('./package.json').version")" = "$RELEASE_VERSION"
          git fetch origin main --tags
          current="$(git rev-parse origin/main)"
          if [ "$current" = "$GITHUB_SHA" ]; then
            test -z "$(git ls-remote --tags origin "refs/tags/${RELEASE_TAG}")"
            echo 'push_required=true' >> "$GITHUB_OUTPUT"
          elif [ "$current" = "$RELEASE_COMMIT" ]; then
            git fetch --no-tags origin "refs/tags/${RELEASE_TAG}"
            test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$RELEASE_COMMIT"
            echo 'push_required=false' >> "$GITHUB_OUTPUT"
          else
            echo 'A newer main revision superseded this release candidate.' >&2
            exit 1
          fi
      - name: Stage the two installers and compatible update manifests
        run: node tools/prepare-release-assets.mjs --input out/release-input --output out/release-publication --version "$RELEASE_VERSION" --source "$GITHUB_SHA" --commit "$RELEASE_COMMIT"
      - name: Require the main-only release App configuration
        if: steps.publication-state.outputs.push_required == 'true'
        env:
          RELEASE_APP_ID: ${{ vars.RELEASE_APP_ID }}
          HAS_RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY != '' }}
        run: test -n "$RELEASE_APP_ID" && test "$HAS_RELEASE_APP_PRIVATE_KEY" = true
      - name: Create the repository-scoped metadata push token
        if: steps.publication-state.outputs.push_required == 'true'
        id: release-app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - name: Atomically publish only the verified metadata commit and tag
        id: publish-metadata
        if: steps.publication-state.outputs.push_required == 'true'
        env:
          RELEASE_PUSH_TOKEN: ${{ steps.release-app-token.outputs.token }}
        run: |
          set -euo pipefail
          git fetch origin main --tags
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          test -z "$(git ls-remote --tags origin "refs/tags/${RELEASE_TAG}")"
          auth_header="$(printf 'x-access-token:%s' "$RELEASE_PUSH_TOKEN" | base64 -w0)"
          echo "::add-mask::${auth_header}"
          git -c "http.${GITHUB_SERVER_URL}/.extraheader=AUTHORIZATION: basic ${auth_header}" push --atomic origin "HEAD:refs/heads/main" "refs/tags/${RELEASE_TAG}"
      - name: Create or resume the exact draft without replacing assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main --tags
          test "$(git rev-parse origin/main)" = "$RELEASE_COMMIT"
          printf 'Resonanz %s, verified from source %s.\n\nInstall the macOS arm64 DMG or Windows x64 installer. The update manifests contain each installer SHA-256 and exact byte count. Installers have no verified publisher signature: macOS uses ad-hoc sealing without notarization and Windows is unsigned. Download, open and use the application at your own risk. The public source is available at https://github.com/pixel-brewery/resonanz and the software is provided as is under the MIT license.\n' "$RELEASE_VERSION" "$GITHUB_SHA" > out/release-notes.md
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json id >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --latest=false --title "Resonanz $RELEASE_VERSION" --notes-file out/release-notes.md
          fi
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" > out/release-state.json
          if jq -e '.draft == true' out/release-state.json >/dev/null; then
            node tools/verify-release-assets.mjs out/release-publication/manifest.json out/release-state.json --allow-missing
            for asset in out/release-publication/assets/*; do
              name="$(basename "$asset")"
              if ! jq -e --arg name "$name" '.assets[] | select(.name == $name)' out/release-state.json >/dev/null; then
                gh release upload "$RELEASE_TAG" "$asset" --repo "$GITHUB_REPOSITORY"
              fi
            done
          else
            node tools/verify-release-assets.mjs out/release-publication/manifest.json out/release-state.json
          fi
      - name: Verify every uploaded byte descriptor before publishing latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" > out/release-state.json
          node tools/verify-release-assets.mjs out/release-publication/manifest.json out/release-state.json
          git fetch origin main --tags
          test "$(git rev-parse origin/main)" = "$RELEASE_COMMIT"
          if jq -e '.draft == true' out/release-state.json >/dev/null; then
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft=false --latest
          fi
      - name: Confirm public latest manifests match the verified candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/releases/latest" > out/published-release.json
          node tools/verify-release-assets.mjs out/release-publication/manifest.json out/published-release.json
          for name in update-darwin-arm64.json update-win32-x64.json; do
            matched=false
            for attempt in 1 2 3 4 5; do
              if curl --fail --silent --show-error --location --max-time 15 "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/${name}" -o "$RUNNER_TEMP/public-update.json" && cmp --silent "out/release-publication/assets/${name}" "$RUNNER_TEMP/public-update.json"; then
                matched=true
                break
              fi
              sleep 5
            done
            test "$matched" = true
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: release-verification
          path: |
            out/release-publication/manifest.json
            out/published-release.json
          if-no-files-found: ignore
          retention-days: 14

  refresh-dependabot:
    name: Refresh dependencies after the durable release
    needs: publish
    if: always() && needs.publish.outputs.metadata_committed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run rebase-dependabot.yml --repo "$GITHUB_REPOSITORY" --ref main
