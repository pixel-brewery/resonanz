interface:
  display_name: 'Resonanz Designer'
  short_description: "Design and review Resonanz's own Mosaik interface"
  default_prompt: 'Use $resonanz-designer to design or review the requested interface through its local design system and the shared Designer.'
dependencies:
  tools:
    - type: 'mcp'
      value: 'mosaik'
      description: 'Installed Mosaik 0.1.192 public catalog via yarn exec mosaik-mcp'
      transport: 'stdio'
policy:
  allow_implicit_invocation: true
